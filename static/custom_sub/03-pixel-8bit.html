<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SPiDER — 8-Bit</title>
<meta name="theme-color" content="#00ff00"/>
<script src="fx.js"></script>
<style>
  :root{
    --c:#00e1c1;--c2:#00ff00;--c3:#ff00ff;--c4:#ff9800;
    --bg:#000000;--panel:rgba(5,5,8,.85);
    --txt:#e8ffa8;--muted:#5a5a5a;--border:rgba(0,255,0,.12)
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Courier New',monospace;background:var(--bg);color:var(--txt);overflow-x:hidden}
  body{
    display:flex;justify-content:center;align-items:flex-start;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    min-height:100vh;
    background-image:
      repeating-linear-gradient(0deg,rgba(0,255,0,.03) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,255,0,.025) 0 1px,transparent 1px 3px);
  }
  .phone{
    width:100%;max-width:390px;
    background:var(--panel);
    border:4px solid var(--c2);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 28px rgba(0,255,0,.12),0 0 0 4px rgba(0,0,0,.8);
    image-rendering:pixelated;
    position:relative;transform:translateZ(0)
  }
  .phone::before{
    content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:150px;height:5px;border-radius:4px;
    background:linear-gradient(90deg,transparent,rgba(0,255,0,.35),transparent);
    z-index:2;animation:bar-anim 3.6s linear infinite
  }
  @keyframes bar-anim{0%{background-position:0 0} 100%{background-position:200% 0}}
  /* CRT curved glass */
  .phone::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.3) 95%);
    border-radius:12px;mix-blend-mode:multiply
  }
  .header{
    padding:22px 16px 20px;text-align:center;
    background:linear-gradient(180deg,rgba(0,30,60,.6),transparent 70%);
    position:relative;
    border-bottom:4px solid var(--c2)
  }
  .header h1{
    font-size:22px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    color:var(--c2);text-shadow:
      2px 2px 0 var(--c3),
      -2px -2px 0 var(--c3),
      0 0 8px rgba(0,255,0,.5);
    image-rendering:pixelated;
    filter:url(#scanlines)
  }
  .header p{font-size:11px;color:var(--c4);margin-top:3px;text-transform:uppercase;letter-spacing:1px}
  .content{
    padding:16px 14px 20px;
    display:flex;flex-direction:column;gap:12px;
    background:linear-gradient(180deg,rgba(5,10,8,.78),rgba(5,10,8,.74))
  }
  .card{
    background:rgba(0,0,0,.75);
    border:3px solid var(--border);
    border-top-color:var(--c2);
    border-bottom-color:var(--c2);
    border-radius:8px;
    padding:15px;
    text-align:center;
    position:relative;
    box-shadow:
      6px 6px 0 rgba(0,0,0,.4),
      inset 0 0 0 2px rgba(255,255,255,.05);
    transition:all .18s;
    image-rendering:pixelated;
    overflow:hidden
  }
  .card.reveal,.card.parallax{transform:translateZ(0)}
  .card:hover{
    transform:translateY(-4px) scale(1.01);
    box-shadow:8px 8px 0 rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,255,0,.1)
  }
  /* pixel scan overlay */
  .card::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(0,255,0,.12),transparent);
    transition:left .7s
  }
  .card:hover::before{left:100%}
  .ring-wrap{position:relative;width:120px;height:120px;margin:0 auto}
  .card-ring svg{width:100%;height:auto;transform:rotate(-90deg);image-rendering:pixelated}
  .card-ring circle{fill:none;stroke-linecap:butt}
  .card-value{
    font-size:22px;font-weight:700;color:var(--c2);margin:4px 0;
    text-shadow:2px 0 0 var(--c3),-2px 0 0 var(--c3),0 2px 0 var(--c),0 -2px 0 var(--c);
    font-variant-numeric:tabular-nums;image-rendering:pixelated
  }
  .card-sub{font-size:10px;color:var(--muted);margin-top:3px}
  .card-title{
    font-size:11px;text-transform:uppercase;letter-spacing:2px;font-weight:600;
    color:var(--c2);border-bottom:2px dashed var(--border);padding-bottom:4px
  }
  .progress-bar{
    height:8px;background:rgba(0,0,0,.45);border:2px solid var(--border);
    border-radius:0;overflow:hidden;margin:10px 0;image-rendering:pixelated
  }
  .progress-fill{
    height:100%;border-radius:0;
    background:linear-gradient(90deg,var(--c2),var(--c));
    box-shadow:0 0 8px var(--c2);transition:width .5s
  }
  .ip-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:6px;z-index:1}
  .ip-item{
    background:rgba(0,0,0,.6);border:2px solid var(--border);
    border-radius:4px;padding:6px;font-size:8px;color:var(--txt);
    font-family:monospace;text-align:left;image-rendering:pixelated
  }
  .buttons{display:flex;gap:10px;margin-top:8px}
  .btn{
    flex:1;padding:12px 8px;border:none;border:3px solid #000;border-radius:6px;
    font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;
    transition:all .2s;image-rendering:pixelated
  }
  .btn:active{transform:scale(.96)}
  .btn-a{
    background:linear-gradient(135deg,var(--c2),var(--c));
    color:#000;box-shadow:0 0 10px var(--c2)
  }
  .btn-b{
    background:transparent;color:var(--c2);border:2px solid var(--c2);
    box-shadow:0 0 6px var(--c2)
  }
  .btn-b:hover{
    background:var(--c2);color:#000;
    box-shadow:0 0 12px var(--c2)
  }
  .cfg-text{
    font-size:9px;font-family:monospace;color:var(--c2);
    margin-top:6px;word-break:break-all;
    background:rgba(0,0,0,.7);padding:8px;border:2px solid var(--border);
    border-radius:4px;overflow-x:auto;text-align:left;direction:ltr;
    image-rendering:pixelated;box-shadow:inset 0 0 6px rgba(0,0,0,.5)
  }
  .toast{
    position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.85);border:2px solid var(--c2);
    color:var(--c2);padding:8px 16px;font-size:12px;z-index:50;opacity:0;
    transition:opacity .3s;box-shadow:0 0 12px var(--c2)
  }
  .toast.show{opacity:1}
  .spinner{width:14px;height:14px;border:2px solid rgba(0,255,0,.12);border-top-color:var(--c2);border-radius:0;animation:spin 1s linear infinite;image-rendering:pixelated}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse-dot{animation:pulse 2s ease-in-out infinite;box-shadow:0 0 8px var(--c)}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px var(--c)} 50%{box-shadow:0 0 18px rgba(0,255,0,.5),0 0 28px rgba(0,255,0,.3)}}
  .en-only,.fa-only{display:inline}
  html[lang="fa"] .en-only{display:none}html[lang="fa"] .fa-only{display:inline}
</style>
<script>
(function(){
  var uname = (new URLSearchParams(location.search)).get('u') || location.hash.slice(1) || location.pathname.split('/').pop() || 'guest';
  var apiUrl='/api/sub/'+encodeURIComponent(uname);var subUrl=window.location.origin+'/sub/'+uname;var state={data:null};
  function fmtBytes(b){if(!b||b<1)return'0 B';var u=['B','KB','MB','GB','TB'],i=0;while(b>=1024&&i<u.length-1){b/=1024;i++}return b.toFixed(i?2:0)+' '+u[i]}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600)}
  function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('COPIED!')},function(){toast('COPY FAIL')})}else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('COPIED!')}catch(e){toast('COPY FAIL')}document.body.removeChild(a)}}
  function ring(d,m){
    var r=42,c=(2*Math.PI*r).toFixed(3),pct=m>0?Math.min(1,d/m):1,off=(c*(1-pct)).toFixed(3);
    var num=d==null||d===undefined?'∞':String(d);
    return'<div class="ring-wrap"><svg viewBox="0 0 120 120"><circle class="stroke-white/10" cx="60" cy="60" fill="transparent" r="'+r+'" stroke-width="7"></circle><circle class="stroke-[#00ff00] progress-ring__circle" cx="60" cy="60" fill="transparent" r="'+r+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="butt" stroke-width="7"></circle></svg><div class="absolute inset-0 flex flex-col items-center justify-center"><span style="font-size:18px;font-weight:700;color:var(--c2)">'+num+'</span><span style="font-size:9px;color:var(--muted)">DAYS</span></div></div>'
  }
  function render(d){
    state.data=d;var used=d.traffic_used_bytes||0;var limit=d.traffic_limit_bytes||0;
    var pct=limit>0?Math.min(100,used/limit*100):0;var days=(d.expire_days===null||d.expire_days===undefined)?null:d.expire_days;
    var active=d.is_active!==false&&d.status==='active';var cfg=d.config||d.vless_link||'';
    var cfgs=Array.isArray(d.configs)?d.configs.filter(function(c){return c&&c.indexOf('%F0%9F%93%8A')===-1;}):(cfg?[cfg]:[]);var r=d.proxy_ips||[];
    var html='';
    html+='<div class="card reveal glow-green"><div class="specular"></div><div class="text-center">'+ring(days,30)+'<div class="mt-2 flex items-center justify-center gap-2"><span class="pulse-dot w-2 h-2 rounded-full"></span><span style="font-size:11px;color:var(--muted)">'+esc(active?'ONLINE':'OFFLINE')+'</span></div></div></div>';
    html+='<div class="card reveal"><div class="card-title">TRAFFIK</div><div class="flex justify-between"><span style="font-size:10px;color:var(--muted)">'+esc(fmtBytes(used))+'</span><span style="font-size:10px;color:var(--muted)">'+(limit>0?esc(fmtBytes(limit)):'∞')+'</span></div><div class="progress-bar"><div class="progress-fill" style="width:'+pct.toFixed(1)+'%"></div></div><div class="card-sub">'+pct.toFixed(1)+' %</div></div>';
    html+='<div class="card reveal"><div class="card-title">PROTOCOL</div><div class="card-value">'+(d.protocol||'vless').toUpperCase()+'</div><div class="card-sub">'+esc(r.length>0?'MULTI-NODE':'STANDARD')+'</div></div>';
    var usedIps=d.used_ips!=null?esc(String(d.used_ips)):'∞';var maxIps=d.max_ip_per_user!=null?esc(String(d.max_ip_per_user)):'∞';
    html+='<div class="card reveal"><div class="card-title">NODES / IP</div><div class="card-value">'+usedIps+'/'+maxIps+'</div>'+(r.length?'<div class="ip-grid">'+r.slice(0,6).map(function(ip){return'<div class="ip-item">'+esc(ip)+'</div>'}).join('')+'</div>':'')+'</div>';
    html+='<div class="card reveal"><div class="card-title">KONFIG</div>'+(cfg?'<div class="cfg-text" dir="ltr" title="'+esc(cfg)+')">'+esc(cfg)+'</div>':'')+'<div class="buttons"><button class="btn btn-a" onclick="copyCfg()"><span>📋</span> COPY</button><button class="btn btn-b" onclick="importSub()">LOAD</button></div></div>';
    document.getElementById('app').innerHTML=html;document.title='SPiDER | '+(d.username||uname);
    setTimeout(function(){if(window.FX)FX.revealAll()},50)
  }
  function renderError(m){var a=document.getElementById('app');a.innerHTML='<div class="card reveal"><div style="text-align:center"><span style="font-size:26px">ERROR</span><h2 style="margin:10px 0">'+esc(uname)+'</h2><p style="color:var(--muted)">'+esc(m)+'</p></div></div>';setTimeout(function(){if(window.FX)FX.revealAll()},50)}
  async function load(){try{var r=await fetch(apiUrl);if(!r.ok){if(r.status===404)throw new Error('NOT FOUND');throw new Error('SERVER ERR')}var d=await r.json();state.data=d;window.__cfg=d.config||d.vless_link||'';window.__cfgs=Array.isArray(d.configs)?d.configs.filter(function(c){return c&&c.indexOf('%F0%9F%93%8A')===-1;}):(window.__cfg?[window.__cfg]:[]);render(d)}catch(e){renderError(e.message)}}
  window.copyCfg=function(){var c=window.__cfg||(window.__cfgs&&window.__cfgs[0]);if(c)copyText(c)};
  window.copySub=function(){copyText(subUrl)};
  window.importSub=function(){window.open('v2rayng://install-sub?url='+encodeURIComponent(subUrl),'_blank')};
  load();
})();
</script>
<body>
<div class="phone reveal glow-green">
  <div class="header"><h1>SPIDER</h1><p>8-BIT PORTAL</p></div>
  <div id="app" style="padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px">
    <div style="text-align:center;padding:40px 20px"><span class="spinner"></span><p style="margin-top:16px;color:var(--muted)">LOADING ROM...</p></div>
  </div>
  <div style="padding:0 14px 8px;text-align:center;border-top:4px solid var(--c2);font-size:9px;color:var(--muted)">v2.6.1 // pixel edition</div>
</div>
<div id="toast" class="toast"></div>
</body>
</html>
