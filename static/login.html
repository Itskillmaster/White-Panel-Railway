<style>
        .glass-card {
            background: rgba(19, 19, 19, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-hover-effect {
            transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), background-color 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:active { transform: scale(0.98); }
        .input-glass {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e2e2;
            caret-color: #e2e2e2;
            transition: border-color 300ms ease, box-shadow 300ms ease;
        }
        .input-glass:focus {
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .error-msg {
            background: rgba(255, 180, 171, 0.1);
            border: 1px solid rgba(255, 180, 171, 0.3);
            color: #ffb4ab;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-msg.show { display: flex; }
        html[data-theme="light"] [data-login-theme] {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        html[data-theme="light"] [data-login-theme] h1,
        html[data-theme="light"] [data-login-theme] input,
        html[data-theme="light"] [data-login-theme] button span { color: #000000 !important; caret-color: #000000; }
        html[data-theme="dark"] [data-login-theme] .input-glass {
            background-color: rgba(0, 0, 0, 0.5) !important;
            border-color: rgba(255, 255, 255, 0.15);
            color: #e2e2e2;
            caret-color: #e2e2e2;
        }
        html[data-theme="light"] [data-login-theme] .input-glass {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.15);
            color: #000000;
        }
        html[data-theme="light"] [data-login-theme] .input-glass:focus {
            border-color: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
        }
        html[data-theme="light"] [data-login-theme] .glass-card { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); }
        html[data-theme="light"] [data-login-theme] .text-on-surface-variant,
        html[data-theme="light"] [data-login-theme] label,
        html[data-theme="light"] [data-login-theme] span.material-symbols-outlined { color: #3a3a3e !important; }
        html[data-theme="light"] body { background: #f2f2f7; }
        html[data-theme="light"] #shader-canvas { display: none; }
        #shader-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ── Premium upgrade layer ── */
        @keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
        @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
        @keyframes blobFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(70px,50px) scale(1.18)}}
        @keyframes glowPulse{0%,100%{box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 70px -20px rgba(0,225,193,.35)}50%{box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 85px -16px rgba(0,225,193,.5)}}
        .orb{position:absolute;border-radius:50%;filter:blur(85px);z-index:1;pointer-events:none}
        .orb-1{width:430px;height:430px;background:rgba(0,225,193,.16);top:-90px;right:-110px;animation:blobFloat 22s ease-in-out infinite alternate}
        .orb-2{width:400px;height:400px;background:rgba(99,102,241,.15);bottom:-100px;left:-100px;animation:blobFloat 27s ease-in-out infinite alternate-reverse}
        .orb-3{width:300px;height:300px;background:rgba(59,130,246,.10);top:38%;left:56%;animation:blobFloat 19s ease-in-out infinite alternate}
        html[data-theme="light"] .orb{opacity:.45}
        [data-login-theme]{
            position:relative;
            animation:cardIn .8s cubic-bezier(.16,1,.3,1) both;
            box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 70px -20px rgba(0,225,193,.35);
            animation-name:cardIn,glowPulse;
            animation-duration:.8s,5s;
            animation-timing-function:cubic-bezier(.16,1,.3,1),ease-in-out;
            animation-iteration-count:1,infinite;
            animation-fill-mode:both,none;
            animation-delay:0s,1s;
        }
        [data-login-theme]::before{
            content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
            background:linear-gradient(135deg,rgba(255,255,255,.45),rgba(0,225,193,.55) 40%,rgba(99,102,241,.4) 75%,rgba(255,255,255,.25));
            -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            -webkit-mask-composite:xor;mask-composite:exclude;
        }
        .logo-tile{
            width:66px;height:66px;border-radius:20px;display:flex;align-items:center;justify-content:center;
            margin-bottom:8px;background:#000;overflow:hidden;position:relative;
            box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 34px -6px rgba(0,225,193,.35),0 0 44px -10px rgba(0,225,193,.3);
        }
        .logo-tile img{width:100%;height:100%;object-fit:cover;display:block}
        .brand-chip{
            display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:4px 13px;border-radius:99px;
            font-size:10.5px;font-weight:700;letter-spacing:2.5px;color:#e6fffb;text-transform:uppercase;
            background:rgba(0,225,193,.08);border:1px solid rgba(0,225,193,.25);
        }
        .btn-hover-effect{position:relative;overflow:hidden}
        .btn-hover-effect::after{
            content:"";position:absolute;top:0;bottom:0;width:45%;left:-65%;
            background:linear-gradient(105deg,transparent,rgba(0,225,193,.35),transparent);
            transform:skewX(-20deg);transition:left .55s ease;
        }
        .btn-hover-effect:hover::after{left:135%}
        .btn-hover-effect:hover{transform:translateY(-2px);box-shadow:0 12px 34px -6px rgba(0,225,193,.45)!important}
        .error-msg.show{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
        .foot-note{margin-top:4px;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.35);text-transform:uppercase;text-align:center}
        html[data-theme="light"] [data-login-theme] .foot-note{color:rgba(0,0,0,.35)}
        /* ── Premium motion accents (login) ── */
        .logo-tile img{animation:wpFloat 6s ease-in-out infinite}
        .brand-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#00e1c1;display:inline-block;box-shadow:0 0 8px #00e1c1;animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
        .btn-hover-effect:hover span.material-symbols-outlined{transform:translateX(4px)}
        .btn-hover-effect span.material-symbols-outlined{transition:transform .3s var(--wp-ease, cubic-bezier(.22,1,.36,1))}
        .input-glass{border-radius:18px}
        .input-glass:focus~.material-symbols-outlined,
        .input-wrapper:focus-within .material-symbols-outlined{color:#00e1c1!important}
    </style>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('white-theme') === 'light' ? 'light' : 'dark');
</script>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative">

<!-- Shader Background -->
<canvas id="shader-canvas"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<script>
(function() {
  var canvas = document.getElementById('shader-canvas');
  function syncSize() {
    var w = canvas.clientWidth || 1280;
    var h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncSize).observe(canvas);
  syncSize();
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  var vs = 'attribute vec2 a_position; varying vec2 v_texCoord; void main() { v_texCoord = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }';
  var fs = 'precision highp float; uniform float u_time; uniform vec2 u_resolution; uniform vec2 u_mouse; varying vec2 v_texCoord; float noise(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); } float smoothNoise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f); float a = noise(i); float b = noise(i + vec2(1.0, 0.0)); float c = noise(i + vec2(0.0, 1.0)); float d = noise(i + vec2(1.0, 1.0)); return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); } void main() { vec2 uv = v_texCoord; vec2 p1 = uv * 3.0 + u_time * 0.05; vec2 p2 = uv * 5.0 - u_time * 0.08; float n = smoothNoise(p1) * 0.5 + smoothNoise(p2) * 0.3; float wave = sin(uv.y * 10.0 + n * 5.0 + u_time * 0.2) * 0.5 + 0.5; wave *= sin(uv.x * 8.0 - u_time * 0.1) * 0.5 + 0.5; vec3 color1 = vec3(0.047, 0.047, 0.047); vec3 color2 = vec3(0.106, 0.106, 0.106); vec3 finalColor = mix(color1, color2, wave * 0.4); float dist = distance(uv, u_mouse / u_resolution); finalColor += 0.03 * (1.0 - smoothstep(0.0, 0.5, dist)); gl_FragColor = vec4(finalColor, 1.0); }';
  function cs(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var prog = gl.createProgram(); gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  var pos = gl.getAttribLocation(prog, 'a_position'); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uRes = gl.getUniformLocation(prog, 'u_resolution');
  var uMouse = gl.getUniformLocation(prog, 'u_mouse');
  var mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      var nx = (e.clientX - rect.left) / rect.width;
      var ny = 1.0 - (e.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });
  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- Login Card -->
<div class="glass-card rounded-3xl w-full max-w-md p-stack-lg mx-margin-mobile flex flex-col gap-stack-lg shadow-2xl shadow-black/50 z-10" data-login-theme>
  <!-- Header -->
  <div class="flex flex-col items-center gap-stack-sm text-center">
    <div class="logo-tile">
      <img src="/static/white-logo.png" alt="White Panel"/>
    </div>
    <h1 class="font-headline-lg text-headline-lg text-on-surface">WHITE PANEL</h1>
    <span class="brand-chip"><span class="material-symbols-outlined" style="font-size:13px;">bolt</span> Premium Gateway · v2.0</span>
  </div>

  <!-- Error -->
  <div class="error-msg" id="error-msg">
    <span class="material-symbols-outlined" style="font-size:18px;">error</span>
    <span id="error-text"></span>
  </div>

  <!-- Form -->
  <form class="flex flex-col gap-stack-md" id="login-form">
    <div class="flex flex-col gap-2">
      <label class="font-code-label text-code-label text-on-surface-variant" for="password">PASSWORD</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-size: 20px;">lock</span>
        <input class="input-glass w-full rounded-3xl py-3 pl-12 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-on-surface-variant/50" id="password" placeholder="Enter password" type="password" autofocus required/>
      </div>
    </div>
    <button class="mt-2 bg-white text-black font-body-lg text-body-lg font-bold py-3 rounded-3xl btn-hover-effect flex items-center justify-center gap-2 hover:bg-gray-200" id="loginBtn" type="submit">
      <span id="btn-text" class="flex items-center gap-2">Sign In <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span></span>
      <span id="btn-spinner" class="hidden"><span class="material-symbols-outlined animate-spin" style="font-size: 20px;">progress_activity</span></span>
    </button>
  </form>
  <div class="foot-note">Secure · Fast · Premium</div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var btnText = document.getElementById('btn-text');
  var btnSpinner = document.getElementById('btn-spinner');
  var errDiv = document.getElementById('error-msg');
  var errText = document.getElementById('error-text');

  errDiv.classList.remove('show');
  btn.disabled = true;
  btnText.classList.add('hidden');
  btnSpinner.classList.remove('hidden');

  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    if (!r.ok) {
      var d = await r.json().catch(function() { return {}; });
      throw new Error(d.detail || 'Login failed');
    }
    location.href = '/white';
  } catch(ex) {
    errText.textContent = ex.message;
    errDiv.classList.add('show');
    btn.disabled = false;
    btnText.classList.remove('hidden');
    btnSpinner.classList.add('hidden');
  }
});
</script>
<script src="/static/premium.js?v=21" defer></script>
