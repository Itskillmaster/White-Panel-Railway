<style>
        body {

        /* Dark scrollbar */

        /* Language Toggle Classes */

        /* ═══ ANIMATED NEON BACKGROUND ═══ */
        .bg-fx {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(ellipse 900px 600px at 25% 20%, rgba(0,225,193,0.16) 0%, transparent 70%),
                radial-gradient(ellipse 700px 500px at 75% 15%, rgba(64,120,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 600px 400px at 60% 75%, rgba(139,92,246,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 500px 400px at 10% 80%, rgba(0,180,255,0.07) 0%, transparent 55%);
        }
        .bg-grid {
            position: fixed;
            inset: -2px;
            z-index: -2;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0,225,193,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,225,193,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 45%, black 20%, transparent 70%);
            animation: grid-drift 36s linear infinite;
        }
        @keyframes grid-drift {
            from { background-position: 0 0; }
            to   { background-position: 48px 48px; }
        }
        /* Mouse neon trail */
        .neon-trail {
            position: fixed;
            width: 520px;
            height: 520px;
            margin: -260px 0 0 -260px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle,
                rgba(0,225,193,0.18) 0%,
                rgba(90,120,255,0.10) 30%,
                rgba(139,92,246,0.05) 50%,
                transparent 70%);
            filter: blur(12px);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.35s ease, transform 0.35s ease;
            will-change: transform;
        }
        .neon-trail.visible { opacity: 1; transform: scale(1); }

        /* Glass panel hover animation */
        .glass-panel {
            transition: transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .glass-panel:hover {
            transform: translateY(-3px);
            border-color: rgba(0,225,193,0.22);
            box-shadow: 0 14px 44px rgba(0,0,0,0.65), 0 0 24px rgba(0,225,193,0.06);
        }

        /* Entrance animations */
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .rise-in { animation: rise-in 0.7s cubic-bezier(.22,1,.36,1) both; }
        .rise-in-1 { animation-delay: 0.08s; }
        .rise-in-2 { animation-delay: 0.16s; }
        .rise-in-3 { animation-delay: 0.24s; }
        .rise-in-4 { animation-delay: 0.32s; }

        /* Neon pulse for status dot */
        @keyframes neon-pulse {
            0%, 100% { box-shadow: 0 0 8px #00e1c1; }
            50%      { box-shadow: 0 0 18px #00e1c1, 0 0 30px rgba(0,225,193,0.5); }
        }
        .pulse-dot { animation: neon-pulse 2.2s ease-in-out infinite; }

        /* Shimmer for primary buttons */
        @keyframes shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .btn-shimmer {
            background: linear-gradient(110deg, #00e1c1 20%, #00ffd9 40%, #00e1c1 60%);
            background-size: 200% 100%;
            animation: shimmer 3.5s linear infinite;
        }

        /* Ambient floating orbs (pure CSS, GPU cheap) */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            pointer-events: none;
            animation: orb-float 18s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }
        .orb-1 { width: 480px; height: 480px; top: -150px; left: -120px; background: #00e1c1; opacity: 0.18; }
        .orb-2 { width: 420px; height: 420px; bottom: -140px; right: -100px; background: #5a78ff; opacity: 0.15; animation-delay: -4s; }
        .orb-3 { width: 300px; height: 300px; top: 35%; left: 60%; background: #8b5cf6; opacity: 0.12; animation-delay: -8s; }
        .orb-4 { width: 360px; height: 360px; top: 70%; left: -80px; background: #00b4d8; opacity: 0.10; animation-delay: -12s; }
        @keyframes orb-float {
            from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.18; }
            50%  { transform: translate3d(50px, -40px, 0) scale(1.15); opacity: 0.22; }
            to   { transform: translate3d(-30px, 50px, 0) scale(1.1); opacity: 0.18; }

    </style>
<script>

        function toggleLanguage() {

                html.dir = 'rtl';

<script>
(function() {
  var uname = window.location.pathname.split('/').filter(Boolean).pop();
  var apiUrl = '/api/sub/' + encodeURIComponent(uname);
  var subUrl = window.location.origin + '/sub/' + uname;
  var state = { data: null };

  /* ═══ NEON MOUSE TRAIL ═══ */
  var trail = document.getElementById('neonTrail');
  var trailX = -999, trailY = -999, curX = -999, curY = -999, trailOn = false;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (trail && !reduced) {
    document.addEventListener('mousemove', function(e) {
      trailX = e.clientX; trailY = e.clientY;
      if (!trailOn) { trailOn = true; trail.classList.add('visible'); }
    });
    document.addEventListener('mouseleave', function() {
      trailOn = false; trail.classList.remove('visible');
    });
    (function loop() {
      curX += (trailX - curX) * 0.12;
      curY += (trailY - curY) * 0.12;
      trail.style.transform = 'translate3d(' + curX + 'px,' + curY + 'px,0) scale(1)';
      requestAnimationFrame(loop);
    })();
  }

  function fmtBytes(b) {
    if (!b || b < 1) return '0 B';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 2 : 0) + ' ' + u[i];
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2200);
  }

  function copyText(txt) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).then(function() { toast('Copied!'); }, function() { toast('Copy failed'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('Copied!'); } catch (e) { toast('Copy failed'); }
      document.body.removeChild(ta);
    }
  }

  function ring(days, maxDays) {
    var r = 54, c = 2 * Math.PI * r;
    var pct = maxDays > 0 ? Math.min(1, days / maxDays) : 1;
    var off = c * (1 - pct);
    var num = (days === null || days === undefined) ? '∞' : String(days);
    var unit = 'Days';
    return '<div class="ring-wrap w-48 h-48 mx-auto relative flex items-center justify-center">' +
      '<svg class="w-full h-full" viewBox="0 0 120 120">' +
      '<circle class="stroke-white/10" cx="60" cy="60" fill="transparent" r="54" stroke-width="8"></circle>' +
      '<circle class="stroke-[#00ffff] progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="' + c.toFixed(3) + '" stroke-dashoffset="' + off.toFixed(3) + '" stroke-linecap="round" stroke-width="8" style="filter: drop-shadow(0 0 4px rgba(0,255,255,0.4));"></circle>' +
      '</svg>' +
      '<div class="absolute flex flex-col items-center">' +
      '<span class="font-headline-lg text-headline-lg text-on-surface neon-text">' + num + '</span>' +
      '<span class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-widest">' + unit + '</span>' +
      '</div></div>';
  }

  function render(d) {
    var used = d.traffic_used_bytes || 0;
    var limit = d.traffic_limit_bytes || 0;
    var pct = limit > 0 ? Math.min(100, used / limit * 100) : 0;
    var days = (d.expire_days === null || d.expire_days === undefined) ? null : d.expire_days;
    var isActive = d.is_active !== false && d.status === 'active';
    var cfg = d.config || d.vless_link || '';

    // Left column: hero + stats
    var left =
      '<div class="glass-panel rounded-3xl p-stack-lg flex flex-col items-center justify-center relative overflow-hidden h-full min-h-[300px] rise-in rise-in-1">' +
        '<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at center, #00e1c1 0%, transparent 60%);"></div>' +
        '<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md z-10">' +
          '<span class="en-only">Time Left</span><span class="fa-only">زمان باقیمانده</span>' +
        '</h2>' +
        ring(days, 30) +
        '<div class="mt-stack-md flex gap-2 items-center z-10">' +
          '<div class="w-2 h-2 rounded-full bg-[#00ffff] pulse-dot"></div>' +
          '<span class="font-code-label text-code-label text-on-surface-variant">' +
            '<span class="en-only">' + (isActive ? 'Active' : 'Inactive') + '</span>' +
            '<span class="fa-only">' + (isActive ? 'فعال' : 'غیرفعال') + '</span>' +
          '</span>' +
        '</div>' +
      '</div>' +
      '<div class="glass-panel rounded-3xl p-stack-md flex flex-col gap-stack-md rise-in rise-in-2">' +
        '<div>' +
          '<div class="flex justify-between items-end mb-2">' +
            '<span class="font-body-sm text-body-sm text-on-surface-variant">' +
              '<span class="en-only">Traffic Used</span><span class="fa-only">ترافیک مصرفی</span>' +
            '</span>' +
            '<div class="text-right">' +
              '<span class="font-headline-md text-headline-md text-on-surface">' + esc(fmtBytes(used)) + '</span>' +
              '<span class="font-body-sm text-body-sm text-on-surface-variant"> / ' + (limit > 0 ? esc(fmtBytes(limit)) : '∞') + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="w-full h-1.5 bg-black/10 dark:bg-white/10 rounded-full overflow-hidden">' +
            '<div class="h-full bg-on-surface rounded-full" style="width:' + pct.toFixed(1) + '%;box-shadow: 0 0 5px rgba(150,150,150,0.5);"></div>' +
          '</div>' +
        '</div>' +
        '<hr class="border-black/10 dark:border-white/10 my-stack-sm"/>' +
        '<div>' +
          '<div class="flex justify-between items-end mb-2">' +
            '<span class="font-body-sm text-body-sm text-on-surface-variant">' +
              '<span class="en-only">Protocol</span><span class="fa-only">پروتکل</span>' +
            '</span>' +
            '<div class="text-right">' +
              '<span class="font-headline-md text-headline-md text-on-surface" style="font-size:18px;">' + esc((d.protocol || 'vless').toUpperCase()) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<hr class="border-black/10 dark:border-white/10 my-stack-sm"/>' +
        '<div>' +
          '<div class="flex justify-between items-end mb-2">' +
            '<span class="font-body-sm text-body-sm text-on-surface-variant">' +
              '<span class="en-only">IP Devices</span><span class="fa-only">تعداد دستگاه</span>' +
            '</span>' +
            '<div class="text-right">' +
              '<span class="font-headline-md text-headline-md text-on-surface" style="font-size:18px;">' + (d.used_ips != null ? esc(String(d.used_ips)) + ' / ' + (d.max_ip_per_user != null ? esc(String(d.max_ip_per_user)) : '∞') : '∞') + '</span>' +
            '</div>' +
          '</div>' +
          (d.proxy_ips && d.proxy_ips.length ?
            '<div class="flex flex-wrap gap-1.5 mt-2">' +
              d.proxy_ips.map(function(ip){ return '<span class="px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/10 font-code-label text-[10px] text-on-surface-variant" dir="ltr">' + esc(ip) + '</span>'; }).join('') +
            '</div>' : '') +
        '</div>' +
      '</div>';

    // Right column: config
    var right =
      '<div class="glass-panel rounded-3xl p-stack-lg flex-1 flex flex-col rise-in rise-in-3">' +
        '<div class="flex justify-between items-center mb-stack-lg">' +
          '<h2 class="font-headline-md text-headline-md text-on-surface">' +
            '<span class="en-only">Configuration</span><span class="fa-only">پیکربندی</span>' +
          '</h2>' +
          '<div class="flex gap-3">' +
            (cfg ?
              '<button onclick="showQr()" class="qr-btn flex items-center gap-2 px-4 py-2 border border-black/10 dark:border-white/12 rounded-lg text-code-label text-code-label text-on-surface hover:bg-black/5 dark:hover:bg-white/5 transition-all duration-300 hover:scale-[1.02]">' +
                '<span class="material-symbols-outlined text-[18px]">qr_code_2</span>' +
                '<span class="en-only">QR Code</span><span class="fa-only">کد QR</span>' +
              '</button>' : '') +
            (cfg ?
              '<button onclick="copyCfg()" class="flex items-center gap-2 px-4 py-2 bg-on-surface text-background rounded-lg font-code-label text-code-label hover:bg-on-surface/90 transition-all duration-300 hover:scale-[1.02]">' +
                '<span class="material-symbols-outlined text-[18px]">content_copy</span>' +
                '<span class="en-only">Copy</span><span class="fa-only">کپی</span>' +
              '</button>' : '') +
          '</div>' +
        '</div>' +
        '<div class="flex flex-col gap-stack-md overflow-y-auto pr-2 custom-scrollbar">' +
          (cfg ? buildStatusBlock() : '') +
          (buildConfigBlocks()) +
          (cfg ?
            '<div class="flex flex-wrap gap-2 mt-2">' +
              '<button onclick="copySub()" class="flex items-center gap-2 px-4 py-2 border border-black/10 dark:border-white/12 rounded-lg font-code-label text-code-label text-on-surface hover:bg-black/5 dark:hover:bg-white/5 transition-all duration-300 hover:scale-[1.02]">' +
                '<span class="material-symbols-outlined text-[18px]">link</span>' +
                '<span class="en-only">Copy Sub Link</span><span class="fa-only">کپی لینک ساب</span>' +
              '</button>' +
              '<button onclick="importSub()" class="flex items-center gap-2 px-4 py-2 btn-shimmer text-black rounded-lg font-code-label text-code-label hover:opacity-90 transition-all duration-300 hover:scale-[1.02]">' +
                '<span class="material-symbols-outlined text-[18px]">download</span>' +
                '<span class="en-only">Import Now</span><span class="fa-only">وارد کردن</span>' +
              '</button>' +
            '</div>' : '') +
        '</div>' +
      '</div>';

    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="md:col-span-4 flex flex-col gap-gutter">' + left + '</div>' +
      '<div class="md:col-span-8 flex flex-col h-full">' + right + '</div>';
  }

  // Status config block — always shown FIRST in the config column.
  function buildStatusBlock() {
    var dd = state.data || {};
    var sdays = (dd.expire_days === null || dd.expire_days === undefined) ? null : dd.expire_days;
    var sused = dd.traffic_used_bytes || 0;
    var slim = dd.traffic_limit_bytes || 0;
    var spct = dd.traffic_percent != null ? dd.traffic_percent : (slim > 0 ? Math.min(100, sused / slim * 100) : 0);
    return '<div class="group border border-black/5 dark:border-white/12 bg-black/5 dark:bg-white/5 rounded-2xl p-stack-md hover:bg-black/10 dark:hover:bg-white/10 transition-colors cursor-pointer relative overflow-hidden" onclick="copyStatus()">' +
      '<div class="absolute ltr:left-0 rtl:right-0 top-0 bottom-0 w-1 bg-[#00ffff] opacity-0 group-hover:opacity-100 transition-opacity neon-border"></div>' +
      '<div class="flex flex-col gap-1 ltr:pl-2 rtl:pr-2 min-w-0 flex-1">' +
        '<div class="flex items-center gap-2">' +
          '<span class="material-symbols-outlined text-[15px] text-on-surface-variant">schedule</span>' +
          '<span class="font-code-label text-code-label text-on-surface font-bold ltr:text-left rtl:text-right">' +
            '<span class="en-only">Status Config</span><span class="fa-only">کانفیگ وضعیت</span>' +
          '</span>' +
        '</div>' +
        '<div class="flex flex-wrap gap-2 mt-1">' +
          '<span class="px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/10 font-code-label text-[10px] text-on-surface-variant">' +
            '<span class="en-only">Time Left:</span><span class="fa-only">زمان باقیمانده:</span> ' + (sdays === null ? '∞' : esc(String(sdays))) + ' ' +
            '<span class="en-only">days</span><span class="fa-only">روز</span>' +
          '</span>' +
          '<span class="px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/10 font-code-label text-[10px] text-on-surface-variant">' +
            '<span class="en-only">Traffic:</span><span class="fa-only">حجم:</span> ' + esc(fmtBytes(sused)) + ' / ' + (slim > 0 ? esc(fmtBytes(slim)) : '∞') +
          '</span>' +
          '<span class="px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/10 font-code-label text-[10px] text-on-surface-variant">' + spct.toFixed(1) + '%' + '</span>' +
        '</div>' +
        '<span class="cfg-text text-on-surface-variant truncate max-w-[130px] md:max-w-[320px] ltr:text-left rtl:text-right" dir="ltr">' +
          esc(window.__statuscfg || (state.data && (state.data.username || uname)) || '') +
        '</span>' +
      '</div>' +
    '</div>';
  }

  function cfgBlock(c, i, dd) {
    // Read the real network type from the config link itself (&type=...),
    // which is authoritative — the user-level transport_type can be stale.
    var tmatch = c.match(/[?&]type=([a-z0-9-]+)/i);
    var ctype = tmatch ? tmatch[1].toUpperCase() : 'WS';
    return '<div class="group border border-black/5 dark:border-white/12 bg-black/5 dark:bg-white/5 rounded-2xl p-stack-md flex justify-between items-center hover:bg-black/10 dark:hover:bg-white/10 transition-colors cursor-pointer relative overflow-hidden" onclick="copyCfgIndex(' + i + ')">' +
      '<div class="absolute ltr:left-0 rtl:right-0 top-0 bottom-0 w-1 bg-[#00ffff] opacity-0 group-hover:opacity-100 transition-opacity neon-border"></div>' +
      '<div class="flex flex-col gap-1 ltr:pl-2 rtl:pr-2 min-w-0">' +
        '<div class="flex items-center gap-2">' +
          '<span class="font-code-label text-code-label text-on-surface font-bold ltr:text-left rtl:text-right" dir="ltr">' + esc((dd.protocol || 'vless').toUpperCase()) + ' #' + (i + 1) + '</span>' +
          '<span class="px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/10 font-code-label text-[10px] text-on-surface-variant">' + esc(ctype) + '</span>' +
        '</div>' +
        '<span class="cfg-text text-on-surface-variant truncate max-w-[130px] md:max-w-[320px] ltr:text-left rtl:text-right" dir="ltr">' + esc(c) + '</span>' +
      '</div>' +
    '</div>';
  }

  // Section divider: [flag] label + count. label is already-safe HTML (en/fa spans).
  function cfgSection(label, count, color) {
    return '<div class="flex items-center gap-2 px-3 py-2 my-1 rounded-xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/12">' +
      '<span class="material-symbols-outlined text-[15px]" style="color:' + (color || '#00e676') + '">bolt</span>' +
      '<span class="font-code-label text-[10px] text-on-surface-variant">' + label +
      (count ? ' — ' + count + ' <span class="en-only">configs</span><span class="fa-only">کانفیگ</span>' : '') +
      '</span>' +
    '</div>';
  }

  // One block per main config (multi-inbound). Main configs always render at the
  // top (right after the status config); then Railway custom-IP configs; then
  // Cloudflare custom-IP configs; then Sni Spoof for v2box — each under its own labeled divider.
  function buildConfigBlocks() {
    var dd = state.data || {};
    var cfgs = window.__cfgs || [];
    var customRailway = window.__customRailway || [];
    var customCf = window.__customCf || [];
    var sniSpoof = window.__sniSpoofCfgs || [];
    var mainCount = cfgs.length - customRailway.length - customCf.length - sniSpoof.length;
    var blocks = '';
    for (var i = 0; i < mainCount; i++) {
      if (cfgs[i]) blocks += cfgBlock(cfgs[i], i, dd);
    }
    var idx = mainCount;
    if (customRailway.length) {
      blocks += cfgSection('<span class="en-only">Railway IPs</span><span class="fa-only">آی‌پی‌های Railway</span>', customRailway.length, '#ff9800');
      for (var j = 0; j < customRailway.length; j++) {
        if (cfgs[idx]) blocks += cfgBlock(cfgs[idx], idx, dd);
        idx++;
      }
    }
    if (customCf.length) {
      blocks += cfgSection('<span class="en-only">Cloudflare IPs</span><span class="fa-only">آی‌پی‌های Cloudflare</span>', customCf.length, '#00e676');
      for (var k = 0; k < customCf.length; k++) {
        if (cfgs[idx]) blocks += cfgBlock(cfgs[idx], idx, dd);
        idx++;
      }
    }
    if (sniSpoof.length) {
      blocks += cfgSection('<span class="en-only">Sni Spoof for v2box</span><span class="fa-only">Sni Spoof برای v2box</span>', sniSpoof.length, '#00ffff');
      for (var m = 0; m < sniSpoof.length; m++) {
        if (cfgs[idx]) blocks += cfgBlock(cfgs[idx], idx, dd);
        idx++;
      }
    }
    return blocks;
  }

  function renderError(msg) {
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="md:col-span-12 error-box">' +
        '<span class="material-symbols-outlined text-[48px] text-on-surface-variant" style="font-size:48px;">error</span>' +
        '<h2 class="mt-4 font-headline-md text-headline-md text-on-surface">' + esc(uname) + '</h2>' +
        '<p class="mt-2 font-body-sm text-body-sm text-on-surface-variant">' + esc(msg) + '</p>' +
      '</div>';
  }

  async function load() {
    try {
      var r = await fetch(apiUrl);
      if (!r.ok) {
        if (r.status === 404) throw new Error('User not found');
        throw new Error('Server error');
      }
      var d = await r.json();
      state.data = d;
      window.__cfg = d.config || d.vless_link || '';
      // The backend prepends a fake-stats status config (remark starts with the
      // 📊 emoji = %F0%9F%93%8A) to d.configs for subscription clients. This page
      // builds its own status card from vless_link, so drop the backend status
      // config from the rendered list to avoid showing it twice.
      window.__cfgs = (Array.isArray(d.configs) && d.configs.length)
        ? d.configs.filter(function (c) { return c && c.indexOf('%F0%9F%93%8A') === -1; })
        : (window.__cfg ? [window.__cfg] : []);
      if (!window.__cfgs.length && window.__cfg) window.__cfgs = [window.__cfg];
      // Custom scanned-IP configs are appended to configs by the backend; keep
      // them separate so they render BELOW the main configs in the sub page.
      window.__customCfgs = Array.isArray(d.custom_configs) ? d.custom_configs : [];
      window.__customRailway = Array.isArray(d.custom_railway_configs) ? d.custom_railway_configs : [];
      window.__customCf = Array.isArray(d.custom_cf_configs) ? d.custom_cf_configs : [];
      window.__customCount = d.custom_ip_count || 0;
      // Sni Spoof for v2box configs
      window.__sniSpoofCfgs = Array.isArray(d.sni_spoof_configs) ? d.sni_spoof_configs : [];
      window.__sniSpoofCount = d.sni_spoof_count || 0;
      // Fake/status config: same VLESS format, remark carries the status stats.
      // Clearly marked STATUS so it is never mistaken for the real main config.
      if (window.__cfg) {
        var days = (d.expire_days === null || d.expire_days === undefined) ? '∞' : d.expire_days;
        var pct = d.traffic_percent != null ? Math.round(d.traffic_percent) : (d.traffic_limit_bytes ? Math.round((d.traffic_used_bytes||0) / d.traffic_limit_bytes * 100) : 0);
        var statusRemark = (d.username || uname) + ' STATUS | ' + days + 'd | ' + pct + '%';
        window.__statuscfg = window.__cfg.replace(/#[^#]*$/, '') + '#' + encodeURIComponent(statusRemark);
      } else {
        window.__statuscfg = '';
      }
      document.title = 'Subscription | ' + (d.username || uname);
      render(d);
    } catch (e) {
      renderError(e.message);
    }
  }

  // Build the full config text: STATUS first, then all main configs.
  function allConfigsText() {
    var parts = [];
    if (window.__statuscfg) parts.push(window.__statuscfg);
    (window.__cfgs || []).forEach(function(c){ if (c) parts.push(c); });
    return parts.join('\n');
  }

  window.copyCfg = function() {
    var txt = allConfigsText();
    if (!txt) return;
    copyText(txt);
  };
  window.copyCfgIndex = function(i) {
    var c = (window.__cfgs || [])[i];
    if (c) copyText(c);
  };
  window.copyStatus = function() {
    if (window.__statuscfg) copyText(window.__statuscfg);
  };
  window.copySub = function() {
    copyText(subUrl);
  };
  window.importSub = function() {
    window.open('v2rayng://install-sub?url=' + encodeURIComponent(subUrl), '_blank');
  };
  window.showQr = function() {
    var modal = document.getElementById('qrModal');
    var img = document.getElementById('qrImg');
    if (!modal || !img) return;
    img.src = '/api/sub/' + encodeURIComponent(uname) + '/qr?mode=sub&t=' + Date.now();
    modal.classList.add('show');
  };
  window.closeQr = function() {
    var modal = document.getElementById('qrModal');
    if (modal) modal.classList.remove('show');
  };

  // Ping
  async function ping() {
    var btn = document.getElementById('pingBtn');
    var res = document.getElementById('pingRes');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = 'Pinging...';
    res.textContent = '';
    var t0 = Date.now();
    try {
      var r = await fetch('/sub/' + uname + '/ping', { method: 'HEAD', cache: 'no-store' });
      var ms = Date.now() - t0;
      res.textContent = (ms < 150 ? 'GOOD' : ms < 400 ? 'OK' : 'SLOW') + ' ' + ms + ' ms';
      res.className = 'mt-2 font-body-lg text-body-lg font-bold ' + (ms < 400 ? 'text-[#00e676]' : 'text-[#ffb4ab]');
    } catch (e) {
      res.textContent = 'TIMEOUT';
      res.className = 'mt-2 font-body-lg text-body-lg font-bold text-[#ffb4ab]';
    }
    btn.disabled = false;
    btn.textContent = 'Ping Config';
  }
  window.doPing = ping;

  load();
})();
</script>
<div id="qrModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-200">
  <div class="glass-panel rounded-2xl p-6 max-w-sm w-full mx-4 text-center relative">
    <button onclick="closeQr()" class="absolute top-2 right-2 text-on-surface-variant hover:text-on-surface transition-colors">
      <span class="material-symbols-outlined text-20">close</span>
    </button>
    <h3 class="font-headline-md text-headline-md text-on-surface mb-4">
      <span class="en-only">QR Code</span><span class="fa-only">کد QR</span>
    </h3>
    <img id="qrImg" class="mx-auto rounded-lg border border-black/10 dark:border-white/12 bg-white" alt="QR Code" style="max-width: 200px;" />
    <p class="mt-3 font-body-sm text-on-surface-variant en-only">Scan to import config</p>
    <p class="mt-1 font-body-sm text-on-surface-variant fa-only">برای وارد کردن کانفیگ اسکن کنید</p>
  </div>
</div>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-2.5 rounded-full bg-on-surface text-background text-sm z-50 opacity-0 transition-opacity pointer-events-none"></div>
<style>
  #toast.show { opacity: 1; }
  #qrModal.show { opacity: 1; pointer-events-auto; }
  #qrModal.show img { animation: popIn 0.2s ease-out; }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</body></html>
